</style><style>html,body{overflow:auto!important}body{padding-bottom:100px!important}.hp-detail-actions{position:sticky;bottom:12px;z-index:9999;display:flex;justify-content:center;gap:10px;margin:20px auto;padding:10px;max-width:600px;background:#20272c;border-radius:14px}.hp-detail-actions button{background:#159df5;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:bold 15px Arial;cursor:pointer}.hp-cart-launch{bottom:12px!important;left:auto!important;right:12px!important;transform:none!important}.hp-cart-shade{font-family:Arial,sans-serif}</style><script>
/* Lightweight cart for static HTML: no payment is taken; order is sent by email or WhatsApp. */
(function(){
  var CART_KEY='hpmilk_order_cart_v1';
  var cart={};
  try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{};}catch(e){cart={};}
  function save(){try{localStorage.setItem(CART_KEY,JSON.stringify(cart));}catch(e){} render();window.dispatchEvent(new CustomEvent('hpmilk-cart-changed',{detail:cart}));}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var launch=document.createElement('button');launch.type='button';launch.className='hp-cart-launch';launch.innerHTML='🛒 سبد سفارش <span class="hp-cart-count">0</span>';launch.setAttribute('aria-label','باز کردن سبد سفارش');document.body.appendChild(launch);
  var shade=document.createElement('div');shade.className='hp-cart-shade';shade.innerHTML='<section class="hp-cart-panel" role="dialog" aria-modal="true" aria-labelledby="hp-cart-title"><div class="hp-cart-head"><h2 id="hp-cart-title">سبد سفارش HPmilk</h2><button type="button" class="hp-cart-x" aria-label="بستن">×</button></div><div class="hp-cart-items"></div><div class="hp-cart-total"></div><div class="hp-cart-note">قیمت نهایی و هزینه ارسال فعلاً به‌صورت دستی با فروشنده هماهنگ می‌شود. با ارسال سفارش، پرداختی انجام نمی‌شود.</div><form class="hp-cart-form"><label>نام و نام خانوادگی *<input name="customer" required autocomplete="name" placeholder="نام شما"></label><label>ایمیل<input name="email" type="email" autocomplete="email" placeholder="name@example.com"></label><label>تلفن / واتساپ<input name="phone" type="tel" autocomplete="tel" placeholder="شماره تماس"></label><label>کشور / شهر<input name="location" autocomplete="country-name" placeholder="کشور و شهر"></label><label class="hp-cart-wide">آدرس یا توضیحات سفارش<textarea name="notes" placeholder="آدرس تحویل، مشخصات یا سؤال درباره محصول"></textarea></label><div class="hp-cart-wide hp-cart-actions"><button type="button" class="hp-cart-email">ارسال سفارش با ایمیل</button><button type="button" class="hp-cart-wa">ارسال سفارش با واتساپ</button></div></form></section>';
  document.body.appendChild(shade);
  var itemsEl=shade.querySelector('.hp-cart-items'),totalEl=shade.querySelector('.hp-cart-total'),countEl=launch.querySelector('.hp-cart-count');
  function entries(){return Object.keys(cart).map(function(k){return cart[k];}).filter(function(x){return x&&x.qty>0;});}
  function render(){var all=entries(),count=all.reduce(function(s,x){return s+x.qty;},0);countEl.textContent=count;document.querySelectorAll('.hp-gallery-cart .hp-cart-count').forEach(function(el){el.textContent=count;});
    if(!all.length){itemsEl.innerHTML='<div class="hp-cart-empty">سبد سفارش خالی است. از کارت هر محصول روی «افزودن به سفارش» بزن.</div>';totalEl.textContent='';}
    else{itemsEl.innerHTML=all.map(function(x){return '<div class="hp-cart-item"><div class="hp-cart-item-title">'+esc(x.name)+'<small>قیمت: پس از تأیید اعلام می‌شود</small></div><div class="hp-cart-qty"><button type="button" data-act="minus" data-id="'+esc(x.id)+'" aria-label="کم کردن">−</button><b>'+x.qty+'</b><button type="button" data-act="plus" data-id="'+esc(x.id)+'" aria-label="زیاد کردن">+</button></div><button type="button" class="hp-cart-remove" data-act="remove" data-id="'+esc(x.id)+'">حذف</button></div>';}).join('');totalEl.textContent='مجموع تعداد محصولات: '+count+' · قیمت نهایی با فروشنده هماهنگ می‌شود';}
  }
  function add(id,name){if(!cart[id])cart[id]={id:id,name:name,qty:0};cart[id].qty++;save();launch.animate&&launch.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:220});}
  function getOrder(){var form=shade.querySelector('form');if(!form.reportValidity())return null;var f=new FormData(form),all=entries();if(!all.length){alert('ابتدا حداقل یک محصول به سبد اضافه کن.');return null;}return 'HPmilk - سفارش جدید\n\n'+all.map(function(x){return '- '+x.name+' | تعداد: '+x.qty+' | قیمت: توافقی';}).join('\n')+'\n\nنام: '+(f.get('customer')||'')+'\nایمیل: '+(f.get('email')||'')+'\nتلفن/واتساپ: '+(f.get('phone')||'')+'\nکشور/شهر: '+(f.get('location')||'')+'\nتوضیحات: '+(f.get('notes')||'')+'\n\nلطفاً قیمت نهایی و هزینه ارسال را اعلام کنید.';}
  launch.addEventListener('click',function(){shade.classList.add('hp-open');});shade.querySelector('.hp-cart-x').addEventListener('click',function(){shade.classList.remove('hp-open');});shade.addEventListener('click',function(e){if(e.target===shade)shade.classList.remove('hp-open');});document.addEventListener('keydown',function(e){if(e.key==='Escape')shade.classList.remove('hp-open');});
  itemsEl.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b)return;var id=b.getAttribute('data-id');if(!cart[id])return;var act=b.getAttribute('data-act');if(act==='plus')cart[id].qty++;else if(act==='minus')cart[id].qty--;else if(act==='remove')cart[id].qty=0;if(cart[id].qty<=0)delete cart[id];save();});
  shade.querySelector('.hp-cart-email').addEventListener('click',function(){var msg=getOrder();if(!msg)return;window.location.href='mailto:hpmilk.tr@gmail.com?subject='+encodeURIComponent('HPmilk product order')+'&body='+encodeURIComponent(msg);});
  shade.querySelector('.hp-cart-wa').addEventListener('click',function(){var msg=getOrder();if(!msg)return;window.open('https://wa.me/905316216031?text='+encodeURIComponent(msg),'_blank','noopener');});
  document.addEventListener('hp-gallery-add',function(e){if(e.detail&&e.detail.id)add(e.detail.id,e.detail.name);});
  window.addEventListener('hpmilk-cart-set',function(e){if(!e.detail||typeof e.detail!=='object')return;cart=e.detail;try{localStorage.setItem(CART_KEY,JSON.stringify(cart));}catch(err){}render();});
  document.addEventListener('hp-gallery-cart',function(){shade.classList.add('hp-open');});
  function setupButtons(){var table=document.querySelector('.main > table:last-of-type');if(!table)return;table.querySelectorAll('td').forEach(function(td){var numberEl=td.querySelector('.product-number');if(!numberEl||td.querySelector('.hp-add-button'))return;var n=(numberEl.textContent||'').trim();if(!/^\d+$/.test(n))return;var img=td.querySelector('.product-photo-carousel img, a img, img');var alt=img?(img.getAttribute('alt')||'').trim():'';var name='محصول شماره '+n+(alt&&alt.toLowerCase()!=='image'?' - '+alt:'');var b=document.createElement('button');b.type='button';b.className='hp-add-button';b.textContent='افزودن به سفارش';b.addEventListener('click',function(){add(n,name);launch.querySelector('.hp-cart-count').textContent=entries().reduce(function(s,x){return s+x.qty;},0);b.textContent='✓ اضافه شد';setTimeout(function(){b.textContent='افزودن به سفارش';},1200);});td.appendChild(b);});}
  function init(){render();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(init,0);});else setTimeout(init,0);
})();
</script><style>/* Clean order controls: no black bar or floating cart */ .hp-detail-actions{position:static!important;bottom:auto!important;z-index:auto!important;background:transparent!important;box-shadow:none!important;padding:0!important;margin:22px auto!important;max-width:100%!important;flex-wrap:wrap!important} .hp-cart-launch{display:none!important} body{padding-bottom:16px!important} @media(max-width:520px){.hp-detail-actions{padding:0 12px!important;gap:8px!important}.hp-detail-actions button{font-size:13px!important;padding:11px 12px!important}}</style><div class="hp-detail-actions"><button type="button" id="hp-detail-add">افزودن به سفارش - محصول 2</button><button type="button" id="hp-detail-cart">🛒 سبد سفارش <span id="hp-detail-count">0</span></button></div><script>(function(){function sync(){var el=document.querySelector('.hp-cart-launch .hp-cart-count');document.getElementById('hp-detail-count').textContent=el?el.textContent:'0';}document.getElementById('hp-detail-add').onclick=function(){if(window.opener&&!window.opener.closed){window.opener.postMessage({hpmilkCart:'add',id:'2'},'*');}else{document.dispatchEvent(new CustomEvent('hp-gallery-add',{detail:{id:'2',name:'محصول شماره 2'}}));}sync();this.textContent='✓ اضافه شد - محصول 2';};document.getElementById('hp-detail-cart').onclick=function(){document.dispatchEvent(new Event('hp-gallery-cart'));};document.addEventListener('click',function(){setTimeout(sync,0);});setTimeout(sync,50);})();</script><script>
/* Synchronize this product tab with the main products page, including local file browsing. */
(function(){
 var parent=window.opener;
 if(!parent||parent.closed)return;
 var receiving=false, ready=false;
 function send(d){try{if(parent&&!parent.closed)parent.postMessage(d,'*');}catch(e){}}
 window.addEventListener('message',function(e){
   if(e.source!==parent||!e.data||e.data.hpmilkCart!=='state')return;
   receiving=true;ready=true;
   window.dispatchEvent(new CustomEvent('hpmilk-cart-set',{detail:e.data.cart||{}}));
   receiving=false;
   var el=document.querySelector('.hp-cart-launch .hp-cart-count');
   var badge=document.getElementById('hp-detail-count');if(badge&&el)badge.textContent=el.textContent;
 });
 window.addEventListener('hpmilk-cart-changed',function(e){
   if(receiving||!ready)return;
   send({hpmilkCart:'replace',cart:e.detail});
 });
 send({hpmilkCart:'request'});
 document.getElementById('hp-detail-cart').addEventListener('click',function(){send({hpmilkCart:'request'});});
 window.addEventListener('focus',function(){send({hpmilkCart:'request'});});
})();
