<script id="hp-remove-stray-markup-text">
(function(){
  function scrub(){
    if(!document.body)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),node,bad=[];
    while((node=walker.nextNode())){
      var txt=(node.nodeValue||'').replace(/\s+/g,' ').trim();
      if(/^<\/(?:head|body|html)>(?:\s*<\/(?:body|html)>)*$/i.test(txt)) bad.push(node);
    }
    bad.forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',scrub);
  else scrub();
})();
</script>
