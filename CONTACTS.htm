<style id="hp-contact-icon-links-style">
/* Three contact shortcuts in the empty area below the Contact details. */
.hp-contact-shortcuts{
  display:flex; justify-content:center; align-items:center;
  gap:clamp(18px,5vw,36px); margin:clamp(65px,11vh,135px) auto 85px;
  padding:0 14px; width:100%; max-width:620px; box-sizing:border-box;
}
.hp-contact-shortcuts a{
  display:flex; align-items:center; justify-content:center;
  flex:0 1 110px; width:min(25vw,110px); height:min(25vw,110px);
  max-width:110px; max-height:110px; min-width:70px; min-height:70px;
  text-decoration:none!important; border-radius:27%;
  transition:transform .15s ease, filter .15s ease;
}
.hp-contact-shortcuts a:hover{transform:translateY(-3px);filter:brightness(1.05)}
.hp-contact-shortcuts a:focus-visible{outline:3px solid #fff;outline-offset:4px}
.hp-contact-shortcuts img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;margin:0!important;border:0!important}
@media(max-width:700px){
 .hp-contact-shortcuts{gap:clamp(18px,6vw,40px);margin:clamp(65px,13vh,130px) auto 100px;}
 .hp-contact-shortcuts a{width:min(25vw,105px);height:min(25vw,105px)}
}
</style>

.hp-contact-form-buttons input{padding:8px 18px;border-radius:6px;border:0;cursor:pointer;}
.hp-bottom-region{height:auto!important;min-height:0!important;}
body[data-hp-page="contact"]{min-height:100vh;display:flex;flex-direction:column;background:#111416!important;color:#f4f5f6!important;}
